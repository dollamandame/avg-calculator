<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">

<title>Average Calculator</title>

<style>

*{
    box-sizing:border-box;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
}

body{
    margin:0;
    background:#121212;
    color:white;
}

.header{
    position:fixed;
    top:0;
    left:0;
    right:0;
    display:flex;
    justify-content:space-between;
    align-items:flex-start;

    background:#1e1e1e;
    padding-top:calc(env(safe-area-inset-top) + 12px);
    padding-right:18px;
    padding-bottom:12px;
    padding-left:18px;

    border-bottom:2px solid #333;
    z-index:999;
}

.resultTitle{
    color:#9f9f9f;
    font-size:16px;
    margin-top:4px;
}

.result{
    font-size:38px;
    font-weight:bold;
    line-height:1.1;
}

.leftResults{
    display:flex;
    flex-direction:column;
}

.rightResults{
    display:flex;
    flex-direction:column;
    align-items:flex-end;
    text-align:right;
}

.rightResults .resultTitle{
    font-size:14px;
}

.rightResults .result{
    font-size:34px;
}

.container{
    padding:170px 20px 20px;
}

label{
    display:block;
    margin-top:12px;
    margin-bottom:6px;
    font-size:20px;
    font-weight:bold;
}

input{
    width:100%;
    height:55px;
    font-size:32px;
    text-align:center;
    border:none;
    border-radius:14px;
    background:#2a2a2a;
    color:white;
    outline:none;
}

button{
    width:100%;
    height:55px;
    margin-top:20px;
    border:none;
    border-radius:14px;
    font-size:24px;
    font-weight:bold;
    background:#2979ff;
    color:white;
}


.inputRow{
    display:flex;
    gap:10px;
    align-items:center;
}

.inputRow input{
    flex:1;
}

#plusButton{
    width:60px;
    height:55px;
    margin:0;
    background:#ff9800;
    color:white;
    border:none;
    border-radius:14px;
    font-size:34px;
    font-weight:bold;
}

#presetButton{
    position:absolute;
    top:10px;
    right:0;

    width:70px;
    height:40px;

    margin:0;

    border:none;
    border-radius:10px;

    background:#444;
    color:white;

    font-size:20px;
    font-weight:bold;

    transition:0.2s;
}

#presetButton.active{
    background:#4CAF50;
}

</style>

</head>

<body>
    
<div id="avgPage">

<div class="header">

    <div class="leftResults">

        <div class="resultTitle">NEW AVG</div>
        <div id="avg" class="result">0.000</div>

        <div class="resultTitle">REMOVAL</div>
        <div id="removal" class="result">0.000</div>

    </div>

    <div class="rightResults">

        <div class="resultTitle">MECHANICAL WEDGE</div>
        <div id="wedge" class="result">0.000</div>
        
        <button id="finalButton"
        style="margin-top:10px;background:#ff8c00;height:45px;font-size:18px;">
        FINAL REMOVAL
        </button>

    </div>

</div>


<div class="container">
    
<button id="presetButton">10.</button>

<label>TOP RIGHT ↗️</label>
<input id="rt" inputmode="decimal" enterkeyhint="next">

<label>BOTTOM RIGHT ↘️</label>
<input id="rb" inputmode="decimal" enterkeyhint="next">

<label>BOTTOM LEFT ↙️</label>
<input id="lb" inputmode="decimal" enterkeyhint="next">

<label>TOP LEFT ↖️</label>
<input id="lt" inputmode="decimal" enterkeyhint="next">

<label>OLD AVG</label>
<input id="old" inputmode="decimal" enterkeyhint="done">


</div>

</div>

<div id="finalPage" style="display:none;">

<div class="header">

<div class="leftResults">
<div class="resultTitle">S1 REMOVAL</div>
<div id="s1Display" class="result">0.000</div>

<div class="resultTitle">TOTAL REMOVAL</div>
<div id="totalDisplay" class="result">0.000</div>
</div>

<div class="rightResults">
<div class="resultTitle">S2 REMOVAL</div>
<div id="s2Display" class="result">0.000</div>

<button id="backButton">AVG SCREEN</button>
</div>

</div>

<div class="container">

<label>INCOMING THICKNESS</label>

<input id="incoming" inputmode="decimal" enterkeyhint="next">

<label>FINAL THICKNESS</label>

<input id="finalThickness" inputmode="decimal" enterkeyhint="next">

<label>S1 REMOVAL</label>

<div class="inputRow">

    <input id="s1Input"

           type="text"

           inputmode="decimal"

           enterkeyhint="done">

    <button id="plusButton" type="button">+</button>

</div>

</div>

<script>

const inputs = Array.from(document.querySelectorAll("input"));


inputs.forEach((box,index)=>{

    box.addEventListener("keydown",function(e){

        if(e.key === "Enter"){

            e.preventDefault();

            if(index < inputs.length-1){
                inputs[index+1].focus();
            }

        }

    });


    box.addEventListener("input",calculate);

});



function num(id){

    let value = parseFloat(document.getElementById(id).value);

    return isNaN(value) ? 0 : value;

}



// removes extra decimals without rounding
function truncate3(value){

    return Math.trunc(value * 1000) / 1000;

}



function calculate(){

    let avg =
    (
        num("lt") +
        num("rt") +
        num("lb") +
        num("rb")
    ) / 4;

let values = [
    num("rt"),
    num("rb"),
    num("lb"),
    num("lt")
];

let highest = Math.max(...values);
let lowest = Math.min(...values);

let wedge = highest - lowest;

    let removal = num("old") - avg;


    document.getElementById("avg").textContent =
        truncate3(avg).toFixed(3);


    document.getElementById("removal").textContent =
        truncate3(removal).toFixed(3);
        
        
    document.getElementById("wedge").textContent =
        truncate3(wedge).toFixed(3);

}


function showFinalPage(){

    document.getElementById("avgPage").style.display="none";
    document.getElementById("finalPage").style.display="block";

}

function showAvgPage(){

    document.getElementById("finalPage").style.display="none";
    document.getElementById("avgPage").style.display="block";

}

document.getElementById("finalButton")
.addEventListener("click",showFinalPage);

document.getElementById("backButton")
.addEventListener("click",showAvgPage);

const plusButton = document.getElementById("plusButton");
const s1Box = document.getElementById("s1Input");

if(plusButton && s1Box){

    plusButton.addEventListener("click",function(){

        let text = s1Box.value;

        if(text !== "" && !text.endsWith("+")){
            s1Box.value = text + "+";
        }

        s1Box.focus();

        s1Box.setSelectionRange(
            s1Box.value.length,
            s1Box.value.length
        );

    });

}

function parseExpression(value){

    if(value.trim() === ""){
        return 0;
    }

    return value
    .split("+")
    .reduce(function(total,number){

        return total + (parseFloat(number) || 0);

    },0);

}

function calculateFinal(){

    let incoming =
    parseFloat(document.getElementById("incoming").value) || 0;

    let finalThickness =
    parseFloat(document.getElementById("finalThickness").value) || 0;

    let s1 =
    parseExpression(document.getElementById("s1Input").value);


    let total = incoming - finalThickness;

    let s2 = total - s1;


    document.getElementById("s1Display").textContent =
    truncate3(s1).toFixed(3);

    document.getElementById("totalDisplay").textContent =
    truncate3(total).toFixed(3);

    document.getElementById("s2Display").textContent =
    truncate3(s2).toFixed(3);

}

["incoming","finalThickness","s1Input"].forEach(function(id){

    let box = document.getElementById(id);

    if(box){

        box.addEventListener("input",calculateFinal);

    }

});

calculate();

</script>

</body>
</html>
